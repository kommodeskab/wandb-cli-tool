[project]
name = "wandb-cli-tool"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Andreas Bagge", email = "andreas.bagge@wsa.com" }
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.12.4",
    "textual>=8.2.8",
    "textual-image>=0.12.0",
    "textual-plotext>=1.0.1",
    "wandb>=0.31.2",
]

[project.scripts]
wandb-cli-tool = "wandb_cli_tool:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Image.Image.getdata is deprecated:DeprecationWarning"]
